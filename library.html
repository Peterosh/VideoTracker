<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>观看记录 - 剧迹</title>
    <link rel="stylesheet" href="library.css">
  </head>
  <body>
    <div class="page-shell">
      <header class="app-header">
        <div class="brand-group">
          <span class="brand-mark" aria-hidden="true">
            <span class="icon" data-icon="film" data-icon-size="22"></span>
            <span class="brand-dot"></span>
          </span>
          <div>
            <p class="eyebrow">VIDEO TRACKER</p>
            <h1>观看记录</h1>
          </div>
        </div>

        <div class="header-actions">
          <span class="sync-pill" id="syncState" title="使用当前浏览器账户同步">
            <span class="sync-dot" aria-hidden="true"></span>
            <span id="syncLabel">浏览器同步</span>
          </span>
          <button
            class="icon-button"
            id="refreshButton"
            type="button"
            aria-label="刷新观看记录"
            title="刷新"
          >
            <span class="icon" data-icon="refresh-cw" data-icon-size="19"></span>
          </button>
        </div>
      </header>

      <main class="workspace">
        <aside class="shows-panel" aria-labelledby="showsTitle">
          <div class="panel-heading">
            <div>
              <p class="eyebrow">资料库</p>
              <h2 id="showsTitle">追踪剧集</h2>
            </div>
            <span class="count" id="showCount">0</span>
          </div>

          <label class="search-field" for="showSearch">
            <span class="icon" data-icon="search" data-icon-size="17"></span>
            <input
              id="showSearch"
              type="search"
              autocomplete="off"
              placeholder="搜索剧名或集数"
            >
          </label>

          <section class="sync-card" aria-labelledby="syncCardTitle">
            <div class="sync-card-heading">
              <div>
                <p class="eyebrow" id="syncCardTitle">本地与云端</p>
                <strong id="syncStateText">等待检查</strong>
              </div>
              <span class="sync-result" id="syncResultBadge">未同步</span>
            </div>
            <p class="sync-summary" id="syncSummary">尚未执行同步检查。</p>
            <div class="sync-card-actions">
              <button class="button button-primary button-compact" id="syncNowButton" type="button">
                <span class="icon" data-icon="refresh-cw" data-icon-size="16"></span>
                <span>立即同步</span>
              </button>
              <span class="sync-last-time" id="syncLastTime">尚未同步</span>
            </div>
            <p class="sync-extension-id">
              扩展 ID
              <code id="syncExtensionId"></code>
            </p>
          </section>

          <details class="device-list-panel">
            <summary>
              <span>设备列表</span>
              <span class="count" id="deviceCount">1</span>
            </summary>
            <div class="device-list" id="deviceList">
              <p class="device-list-empty">正在读取设备...</p>
            </div>
          </details>

          <div class="shows-list" id="showsList" aria-live="polite">
            <div class="sidebar-skeleton">
              <span class="skeleton"></span>
              <span class="skeleton"></span>
              <span class="skeleton"></span>
            </div>
          </div>

          <div class="backup-actions">
            <button class="button button-secondary button-compact" id="exportButton" type="button">
              <span class="icon" data-icon="download" data-icon-size="16"></span>
              <span>导出备份</span>
            </button>
            <button class="button button-secondary button-compact" id="importButton" type="button">
              <span class="icon" data-icon="upload" data-icon-size="16"></span>
              <span>导入备份</span>
            </button>
            <input id="importFile" type="file" accept="application/json,.json" hidden>
          </div>
        </aside>

        <section class="detail-panel" id="detailPanel" aria-live="polite">
          <div class="detail-loading">
            <div class="skeleton skeleton-heading"></div>
            <div class="skeleton skeleton-stats"></div>
            <div class="skeleton skeleton-line"></div>
            <div class="skeleton skeleton-line"></div>
          </div>
        </section>
      </main>
    </div>

    <dialog class="delete-dialog" id="deleteDialog" aria-labelledby="deleteTitle">
      <form class="delete-panel" id="deleteForm" method="dialog">
        <div class="dialog-heading">
          <div>
            <p class="eyebrow">确认操作</p>
            <h2 id="deleteTitle">删除记录</h2>
          </div>
          <button
            class="icon-button"
            id="cancelDeleteButton"
            type="button"
            aria-label="关闭删除窗口"
            title="关闭"
          >
            <span class="icon" data-icon="x" data-icon-size="18"></span>
          </button>
        </div>
        <p class="delete-copy" id="deleteMessage"></p>
        <p class="delete-error" id="deleteError" role="alert" hidden></p>
        <div class="dialog-actions">
          <button class="button button-secondary" id="cancelDeleteSecondary" type="button">取消</button>
          <button class="button button-danger" id="confirmDeleteButton" type="submit">
            <span class="icon" data-icon="trash-2" data-icon-size="17"></span>
            <span>删除</span>
          </button>
        </div>
      </form>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="core.js"></script>
    <script src="icons.js"></script>
    <script src="device-profile.js"></script>
    <script src="library.js"></script>
  </body>
</html>
